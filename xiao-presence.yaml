# Seeed Studio XIAO ESP32-C3 + HI-LINK HLK-LD2410B
# Sanitized ESPHome firmware configuration (safe for public repositories).
#
# Setup:
# 1. Copy secrets.example.yaml to secrets.yaml and fill in your own Wi-Fi,
#    OTA password, fallback AP password, and a freshly generated ESPHome API key.
# 2. Compile in ESPHome Device Builder and flash the initial .bin over USB
#    (e.g., via https://web.esphome.io/).
# 3. Add the device in Home Assistant using your generated api_encryption_key.
#
# Wiring (USB-C powered):
# - LD2410B VCC -> XIAO 5V
# - LD2410B GND -> XIAO GND
# - LD2410B TX  -> XIAO D2 / GPIO4 (rx_pin)
# - LD2410B RX  -> XIAO D3 / GPIO5 (tx_pin)
# - LD2410B OUT -> Unused

esphome:
  name: xiao-presence
  friendly_name: XIAO Presence

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "XIAO Presence Setup"
    password: !secret fallback_ap_password

captive_portal:

uart:
  id: radar_uart
  rx_pin: GPIO4  # XIAO D2 <- LD2410B TX
  tx_pin: GPIO5  # XIAO D3 -> LD2410B RX
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: room_radar
  uart_id: radar_uart

binary_sensor:
  - platform: status
    name: Device Status
    entity_category: diagnostic
  - platform: ld2410
    ld2410_id: room_radar
    has_target:
      name: Occupancy
      id: room_occupancy
      device_class: occupancy
      filters:
        - delayed_on: 300ms
        - delayed_off: 1s
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Stationary Target

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    update_interval: 60s
    entity_category: diagnostic
  - platform: ld2410
    ld2410_id: room_radar
    moving_distance:
      name: Moving Target Distance
    still_distance:
      name: Stationary Target Distance
    detection_distance:
      name: Detection Distance
    moving_energy:
      name: Moving Target Energy
    still_energy:
      name: Stationary Target Energy
    # Gate energy readings require Radar Engineering Mode to be enabled.
    g0:
      move_energy:
        name: Gate 0 Moving Energy
      still_energy:
        name: Gate 0 Stationary Energy
    g1:
      move_energy:
        name: Gate 1 Moving Energy
      still_energy:
        name: Gate 1 Stationary Energy
    g2:
      move_energy:
        name: Gate 2 Moving Energy
      still_energy:
        name: Gate 2 Stationary Energy
    g3:
      move_energy:
        name: Gate 3 Moving Energy
      still_energy:
        name: Gate 3 Stationary Energy
    g4:
      move_energy:
        name: Gate 4 Moving Energy
      still_energy:
        name: Gate 4 Stationary Energy
    g5:
      move_energy:
        name: Gate 5 Moving Energy
      still_energy:
        name: Gate 5 Stationary Energy
    g6:
      move_energy:
        name: Gate 6 Moving Energy
      still_energy:
        name: Gate 6 Stationary Energy
    g7:
      move_energy:
        name: Gate 7 Moving Energy
      still_energy:
        name: Gate 7 Stationary Energy
    g8:
      move_energy:
        name: Gate 8 Moving Energy
      still_energy:
        name: Gate 8 Stationary Energy

number:
  - platform: ld2410
    ld2410_id: room_radar
    timeout:
      name: Radar Clear Timeout
    max_move_distance_gate:
      name: Maximum Moving Distance Gate
    max_still_distance_gate:
      name: Maximum Stationary Distance Gate
    g0:
      move_threshold:
        name: Gate 0 Moving Threshold
      still_threshold:
        name: Gate 0 Stationary Threshold
    g1:
      move_threshold:
        name: Gate 1 Moving Threshold
      still_threshold:
        name: Gate 1 Stationary Threshold
    g2:
      move_threshold:
        name: Gate 2 Moving Threshold
      still_threshold:
        name: Gate 2 Stationary Threshold
    g3:
      move_threshold:
        name: Gate 3 Moving Threshold
      still_threshold:
        name: Gate 3 Stationary Threshold
    g4:
      move_threshold:
        name: Gate 4 Moving Threshold
      still_threshold:
        name: Gate 4 Stationary Threshold
    g5:
      move_threshold:
        name: Gate 5 Moving Threshold
      still_threshold:
        name: Gate 5 Stationary Threshold
    g6:
      move_threshold:
        name: Gate 6 Moving Threshold
      still_threshold:
        name: Gate 6 Stationary Threshold
    g7:
      move_threshold:
        name: Gate 7 Moving Threshold
      still_threshold:
        name: Gate 7 Stationary Threshold
    g8:
      move_threshold:
        name: Gate 8 Moving Threshold
      still_threshold:
        name: Gate 8 Stationary Threshold

switch:
  - platform: ld2410
    ld2410_id: room_radar
    engineering_mode:
      name: Radar Engineering Mode

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: Connected WiFi
  - platform: ld2410
    ld2410_id: room_radar
    version:
      name: Radar Firmware Version

button:
  - platform: restart
    name: Restart
    entity_category: config
  - platform: ld2410
    ld2410_id: room_radar
    restart:
      name: Restart Radar
    query_params:
      name: Refresh Radar Settings
