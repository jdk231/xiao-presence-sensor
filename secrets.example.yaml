# Copy this file to secrets.yaml (never commit secrets.yaml to Git).
# Generate a valid 32-byte base64 API encryption key in ESPHome Device Builder
# or with: python3 -c "import os, base64; print(base64.b64encode(os.urandom(32)).decode())"

wifi_ssid: "YOUR_2_4_GHZ_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
api_encryption_key: "YOUR_GENERATED_ESPHOME_API_KEY"
ota_password: "YOUR_OTA_PASSWORD"
fallback_ap_password: "YOUR_FALLBACK_AP_PASSWORD"
